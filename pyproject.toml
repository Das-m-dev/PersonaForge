[project]
name = "ai-influencer-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "httpx>=0.27",
  "boto3>=1.34",
  "uuid6>=2024.1.12"
]

[project.optional-dependencies]
local-gpu = [
  "torch>=2.4",
  "diffusers>=0.31",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "controlnet-aux>=0.0.9",
  "segment-anything-2>=1.0"
]